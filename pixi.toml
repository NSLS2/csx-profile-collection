[workspace]
channels = ["conda-forge"]
name = "csx-profile-collection"
platforms = [{ platform = "linux-64", glibc = "2.17" }]
version = "2026.3.0"
requires-pixi = ">=0.82.1"

# Skip packages published in the last 7 days to limit exposure to compromised releases
[workspace.exclude-newer]
cutoff = "7days"

# Pixi < 0.84 treats the lock file as out of date while it holds an exempt release newer
# than the cutoff, so every `pixi run` re-solves and `--locked` installs fail until that
# release is older than the cutoff. Keep this list short.
[workspace.exclude-newer.exemptions]
# Security floors in [dependencies] may need fixes published within the cooldown
ca-certificates = "*"
certifi = "*"
pip = "*"

[dependencies]
bluesky = ">=1.16.0,<2"
bluesky-tiled-plugins = ">=2.0.13,<3"
ca-certificates = ">=2026.10.23,<2027"
certifi = ">=2026.10.23,<2027"
ipython = ">=9.18.1,<10"
nslsii = ">=0.12.0,<0.13"
ophyd-async = ">=0.21.4,<0.22"
pip = ">=26.2.2,<27"
python = ">=3.11,<3.14"
redis-json-dict = ">=0.2.2,<0.3"
tiled-client = ">=0.2.21,<0.3"

[pypi-dependencies]
csx-tools = { path = ".", editable = true }

# The IPython profile in startup/ (`ipython --profile-dir=.`) runs in the terminal, qs,
# and test environments. They exclude the default feature, so the csx_tools package and
# its dependencies above do not change what the profile runs with.
[feature.profile.dependencies]
bluesky-base = "==1.15.0"
bluesky-queueserver = "*"
matplotlib-base = ">=3.10"
networkx = ">=3.4.2,<4"
# conda-forge builds of nslsii (PyPI) dependencies: keeps confluent-kafka from
# being compiled from source and opencv from needing the system libGL.
bluesky-kafka = ">=0.8.0"
opencv = "*"
numpy = "*"
ophyd = ">=1.11.0"
pyepics = "*"
python = ">=3.12,<3.13"
semver = ">=3.0.4,<4"
tiled-client = ">=0.2.21"
gobject-introspection = ">=1.84.0,<2"
pygobject = ">=3.50.0,<4"
hklpy = ">=1.1.2,<2"
hdf5-external-filter-plugins = ">=0.1.0,<0.2"
blosc-hdf5-plugin = ">=1.0.1,<2"
databroker = "==2.0.0"
epicscorelibs = ">=7.0.7.99.1.1,<8"
bluesky-tiled-plugins = ">=2.0.13"
ophyd-async = "==0.21.4"
ca-certificates = ">=2026.10.19"
certifi = ">=2026.10.19"
pip = ">=26.2.2"
graphql-core = ">=3.2,<3.3"

[feature.profile.pypi-dependencies]
pvxslibs = ">=1.3.2, <2"
# conda-forge has only 0.12.0 so far.
nslsii = "==0.12.1"

[feature.qs.dependencies]
bluesky-queueserver = "*"
bluesky-httpserver = "*"

[feature.qs.tasks]
# This section needs some development work to understand the best way to
# thread the required configuration through both the task and files checked into
# the profile.  These will interact with the ansible roles for pushing out the
# systemd units
qs-backend = "start-re-manager --profile-dir=."
qs-server = "uvicorn --host localhost --port 60610 bluesky_httpserver.server:app"

[feature.terminal.dependencies]
ipython = ">=9.5.0"
pyside6 = "*"
numpy = ">2"
nexpy = ">=2.1.0,<3"

[feature.terminal.tasks]
start = "unset SESSION_MANAGER PYTHONPATH && MPLBACKEND=qtagg ipython --profile-dir=."

[feature.test.dependencies]
pytest = "*"
pytest-asyncio = "==1.4.0"
ipython = ">=9.5.0"

[feature.test.tasks]
tests = { cmd = "pytest tests/startup", default-environment = "test" }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.dev.dependencies]
copier = ">=9.19.1,<10"
hatch = ">=1.18.2,<2"
import-linter = ">=2.15,<3"
inflection = ">=0.5.1,<0.6"
mdformat = ">=1.0.0,<2"
mdformat-frontmatter = ">=2.1.2,<3"
nbstripout = ">=0.9.1,<0.10"
pre-commit = ">=4.7.0,<5"
pre-commit-hooks = ">=6.0.0,<7"
pyright = ">=1.1.414,<2"
pytest = ">=9.2.0,<10"
pytest-asyncio = ">=1.4.1.post1,<2"
pytest-cov = ">=7.1.0,<8"
pytest-mock = ">=3.17.0,<4"
pytest-timeout = ">=2.4.0,<3"
ruff = ">=0.17.3,<0.18"
tiled-server = ">=0.2.21,<0.3"

[feature.dev.tasks]
tests = "pytest --cov=src/csx_tools --cov-report=term"
lint = "pre-commit run --all-files"
update-template = "copier update --trust ."

[environments]
# Base environments
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

# IPython profile environments
terminal = { features = ["profile", "terminal"], no-default-feature = true, solve-group = "profile" }
qs = { features = ["profile", "qs"], no-default-feature = true, solve-group = "profile" }
test = { features = ["profile", "test"], no-default-feature = true, solve-group = "profile" }

# Python version specific environments for CI
py311 = { features = ["dev", "py311"], solve-group = "py311" }
py312 = { features = ["dev", "py312"], solve-group = "py312" }
py313 = { features = ["dev", "py313"], solve-group = "py313" }
